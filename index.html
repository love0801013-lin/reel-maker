<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業 Reels 封面產生器 - 精確修正版</title>
    <style>
        @font-face {
    font-family: 'SweiXDPearl';
    src: url('SweiXDPearlCJKtc-Black.ttf') format('truetype');
}
        body { font-family: 'SweiXDPearl', sans-serif; display: flex; flex-direction: column; align-items: center; background: #eaedf1; padding: 20px; }
        .container { display: flex; gap: 20px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .controls { width: 340px; display: flex; flex-direction: column; gap: 12px; }
        .preview-area { position: relative; }
        canvas { border-radius: 8px; background: #333; max-width: 380px; height: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        input, textarea, button { padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .color-row { display: flex; gap: 10px; align-items: center; }
        .color-row input[type="color"] { width: 50px; height: 40px; padding: 2px; cursor: pointer; }
        
        button { font-weight: bold; cursor: pointer; transition: 0.2s; border: none; }
        #downloadBtn { background: #bd3525; color: white; margin-top: 10px; padding: 15px; font-size: 16px; }
        #downloadBtn:hover { background: #a32d1f; }
        
        #resetBtn { background: #f0f0f0; color: #666; margin-top: 5px; padding: 10px; font-size: 13px; }
        #resetBtn:hover { background: #e0e0e0; color: #333; }

        label { font-size: 13px; color: #666; font-weight: bold; margin-top: 5px; display: block; }
        .hint { font-size: 11px; color: #999; line-height: 1.5; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <h3>封面樣式調整</h3>
            
            <label>1. 背景圖片</label>
            <input type="file" id="imageInput" accept="image/*">
            
            <label>2. 地區標籤設定</label>
            <input type="text" id="locInput" value="板橋">
            <div class="color-row">
                <div style="flex:1">
                    <label style="font-size:11px">標籤底色</label>
                    <input type="color" id="locBgColor" value="#f7ebd5">
                </div>
                <div style="flex:1">
                    <label style="font-size:11px">標籤文字</label>
                    <input type="color" id="locTextColor" value="#663d0c">
                </div>
            </div>
            
            <label>3. 主標題 (兩行)</label>
            <textarea id="titleInput" rows="2">市場內的早午餐&#10;舒芙蕾必點!</textarea>

            <div class="hint">
                • 標題：紅字白邊 (#bd3525 + #ffffff)<br>
                • 陰影模糊度：12px (75% 透明度)<br>
                • 浮水印：yjtw_life (Palace Script)
            </div>

            <button id="downloadBtn">下載 1080x1920 PNG</button>
            <button id="resetBtn">恢復原始設定</button>
        </div>

        <div class="preview-area">
            <canvas id="canvas" width="1080" height="1920"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageInput = document.getElementById('imageInput');
        const locInput = document.getElementById('locInput');
        const locBgColor = document.getElementById('locBgColor');
        const locTextColor = document.getElementById('locTextColor');
        const titleInput = document.getElementById('titleInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        let bgImage = null;

        const defaults = {
            loc: "板橋",
            locBg: "#f7ebd5",
            locText: "#663d0c",
            title: "市場內的早午餐\n舒芙蕾必點!"
        };

        function draw(isExport = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (bgImage) {
                const canvasRatio = canvas.width / canvas.height;
                const imgRatio = bgImage.width / bgImage.height;
                let dW, dH, sX, sY;
                if (imgRatio > canvasRatio) {
                    dH = canvas.height; dW = bgImage.width * (canvas.height / bgImage.height);
                    sX = (canvas.width - dW) / 2; sY = 0;
                } else {
                    dW = canvas.width; dH = bgImage.height * (canvas.width / bgImage.width);
                    sX = 0; sY = (canvas.height - dH) / 2;
                }
                ctx.drawImage(bgImage, sX, sY, dW, dH);
            }

            // 漸層遮罩
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(201, 176, 145, 0.1)');
            gradient.addColorStop(1, 'rgba(201, 176, 145, 0.8)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- 置中佈局計算 ---
            const locRectH = 148;
            const titleFontSize = 125;
            const titleLineHeight = 170 * 0.98; 
            const wmFontSize = 100;
            const spacingA = 54;
            const spacingB = 40;

            const titleLines = titleInput.value.split('\n');
            const totalContentHeight = locRectH + spacingA + (titleLines.length * titleLineHeight) + spacingB + wmFontSize;
            const startY = (canvas.height - totalContentHeight) / 2;

            // 1. 地區標籤 (12px 陰影模糊度)
            const locText = locInput.value;
            if (locText) {
                const rectW = 373;
                const rectH = locRectH;
                const rectX = (canvas.width - rectW) / 2;
                const rectY = startY;

                ctx.save();
                ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
                ctx.shadowBlur = 12; // 修正為 12px
                ctx.shadowOffsetX = 10;
                ctx.shadowOffsetY = 10;

                ctx.fillStyle = locBgColor.value;
                drawRoundedRect(ctx, rectX, rectY, rectW, rectH, 74);
                ctx.fill();

                ctx.shadowColor = "transparent";
                ctx.fillStyle = locTextColor.value;
                ctx.font = "bold 80px 'SweiXDPearl', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(locText, canvas.width / 2, rectY + rectH / 2 + 5);
                ctx.restore();
            }

            // 2. 大標題 (紅字 #bd3525 + 白邊 + 12px 陰影)
            if (titleInput.value) {
                ctx.save();
                ctx.font = `bold ${titleFontSize}px 'SweiXDPearl', sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const titleBaseY = startY + locRectH + spacingA + (titleLineHeight / 2);

                titleLines.forEach((line, i) => {
                    const y = titleBaseY + (i * titleLineHeight);
                    
                    // 陰影設定
                    ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
                    ctx.shadowBlur = 12; // 修正為 12px
                    ctx.shadowOffsetX = 10;
                    ctx.shadowOffsetY = 10;

                    // 白色外框
                    ctx.strokeStyle = "#ffffff"; 
                    ctx.lineWidth = 25;
                    ctx.lineJoin = "round";
                    ctx.strokeText(line, canvas.width / 2, y);
                    
                    // 紅色文字本體
                    ctx.shadowColor = "transparent";
                    ctx.fillStyle = "#bd3525";
                    ctx.fillText(line, canvas.width / 2, y);
                });
                ctx.restore();
            }

            // 3. 固定浮水印
            ctx.save();
            ctx.font = `${wmFontSize}px "Palace Script MT", cursive`;
            ctx.fillStyle = "#663d0c"; 
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const wmY = startY + locRectH + spacingA + (titleLines.length * titleLineHeight) + spacingB + (wmFontSize / 2);
            ctx.fillText("yjtw_life", canvas.width / 2, wmY);
            ctx.restore();

            // 4. 安全區預覽
            if (!isExport) {
                ctx.save();
                ctx.strokeStyle = "rgba(255, 235, 59, 0.6)";
                ctx.lineWidth = 4;
                ctx.setLineDash([15, 15]);
                const offset = (canvas.height - 1350) / 2;
                ctx.beginPath(); ctx.moveTo(0, offset); ctx.lineTo(canvas.width, offset); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, offset + 1350); ctx.lineTo(canvas.width, offset + 1350); ctx.stroke();
                ctx.restore();
            }
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                const img = new Image();
                img.onload = () => { bgImage = img; draw(); };
                img.src = f.target.result;
            };
            reader.readAsDataURL(file);
        });

        [locInput, locBgColor, locTextColor, titleInput].forEach(el => 
            el.addEventListener('input', () => draw(false))
        );

        resetBtn.addEventListener('click', () => {
            if(confirm("確定要恢復原始設定嗎？")) {
                locInput.value = defaults.loc;
                locBgColor.value = defaults.locBg;
                locTextColor.value = defaults.locText;
                titleInput.value = defaults.title;
                imageInput.value = "";
                bgImage = null;
                draw(false);
            }
        });

        downloadBtn.addEventListener('click', () => {
            draw(true);
            const link = document.createElement('a');
            link.download = 'reel-cover-pro-final.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            draw(false);
        });

        document.fonts.ready.then(() => draw(false));
    </script>
</body>
</html>
